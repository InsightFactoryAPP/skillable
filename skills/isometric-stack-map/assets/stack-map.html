<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stack Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f4f2ec;
  --bg-2: #ebe8df;
  --ink: #1c2229;
  --ink-soft: #5b6672;
  --line: rgba(28, 34, 41, .78);
  --line-faint: rgba(28, 34, 41, .16);
  --face: #fbfaf6;
  --face-side: #efece4;
  --face-dark: #e3dfd4;
  --glow: #ff9f1c;
  --glow-soft: rgba(255, 159, 28, .22);
  --degraded: #e4572e;
  --down: #8a939c;
  --accent: #1f7a8c;
  --panel: rgba(251, 250, 246, .94);
  --panel-border: rgba(28, 34, 41, .14);
  --shadow: 0 10px 30px rgba(28, 34, 41, .12);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #090d12;
    --bg-2: #0f151c;
    --ink: #d7e1ea;
    --ink-soft: #8696a6;
    --line: rgba(196, 214, 230, .72);
    --line-faint: rgba(196, 214, 230, .12);
    --face: #0f161e;
    --face-side: #0c1219;
    --face-dark: #080c11;
    --glow: #4ff0ff;
    --glow-soft: rgba(79, 240, 255, .18);
    --degraded: #ff8a3d;
    --down: #4a5561;
    --accent: #7cc7ff;
    --panel: rgba(13, 19, 26, .92);
    --panel-border: rgba(196, 214, 230, .14);
    --shadow: 0 10px 30px rgba(0, 0, 0, .5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #090d12;
  --bg-2: #0f151c;
  --ink: #d7e1ea;
  --ink-soft: #8696a6;
  --line: rgba(196, 214, 230, .72);
  --line-faint: rgba(196, 214, 230, .12);
  --face: #0f161e;
  --face-side: #0c1219;
  --face-dark: #080c11;
  --glow: #4ff0ff;
  --glow-soft: rgba(79, 240, 255, .18);
  --degraded: #ff8a3d;
  --down: #4a5561;
  --accent: #7cc7ff;
  --panel: rgba(13, 19, 26, .92);
  --panel-border: rgba(196, 214, 230, .14);
  --shadow: 0 10px 30px rgba(0, 0, 0, .5);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: radial-gradient(ellipse at 50% 40%, var(--bg-2), var(--bg) 70%);
  background-color: var(--bg);
  color: var(--ink);
  font: 14px/1.45 Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
  overflow: hidden;
}
.mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace; }
#stage { position: fixed; inset: 0; touch-action: none; cursor: grab; }
#stage.dragging { cursor: grabbing; }
svg#scene { width: 100%; height: 100%; display: block; }

/* geometry */
.face { stroke: var(--line); stroke-width: .9; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
.face.top { fill: var(--face); }
.face.side-a { fill: var(--face-side); }
.face.side-b { fill: var(--face-dark); }
.detail { fill: none; stroke: var(--line); stroke-width: .7; vector-effect: non-scaling-stroke; }
.platform .face { stroke: var(--line-faint); stroke-width: 1; }
.platform .face.top { fill: var(--line-faint); fill-opacity: .25; }
.platform .grid { stroke: var(--line-faint); stroke-width: .6; }
.platform-label { fill: var(--ink-soft); font: 600 11px "JetBrains Mono", ui-monospace, monospace; letter-spacing: .12em; text-transform: uppercase; }
.zone { fill: none; stroke: var(--accent); stroke-width: 1; stroke-dasharray: 5 4; opacity: .55; vector-effect: non-scaling-stroke; }
.zone-label { fill: var(--accent); font: 600 10px "JetBrains Mono", ui-monospace, monospace; letter-spacing: .08em; opacity: .85; }

.node { cursor: pointer; outline: none; transition: opacity .25s; }
.node.on .face { stroke: var(--glow); }
.node.on .face.top { fill: var(--glow-soft); }
.node.on .detail { stroke: var(--glow); }
.node.on .glow-layer { filter: url(#glow); }
.node.degraded .face, .node.degraded .detail { stroke: var(--degraded); }
.node.degraded .face.top { fill: color-mix(in srgb, var(--degraded) 18%, transparent); }
.node.degraded .glow-layer { filter: url(#glow); animation: flicker 1.6s infinite steps(2, end); }
.node.off .face, .node.off .detail { stroke: var(--down); }
.node.off .face.top { fill: var(--face); }
.node.idle .face, .node.idle .detail { stroke-dasharray: 3 3; }
.node.external .face, .node.external .detail { stroke-dasharray: 6 3; }
.node.external .face { fill: transparent; }
.node:hover .face, .node:focus-visible .face, .node.selected .face { stroke-width: 1.8; }
.node.selected .face.top { fill: color-mix(in srgb, var(--accent) 22%, transparent); }
.dim .node:not(.related), .dim .link:not(.related), .dim .label:not(.related) { opacity: .16; }

.link path { fill: none; vector-effect: non-scaling-stroke; }
.link .wire { stroke: var(--line); stroke-width: 1; opacity: .55; }
.link .hit { stroke: transparent; stroke-width: 12; cursor: pointer; }
.link.async .wire { stroke-dasharray: 4 4; }
.link.live .wire { stroke: var(--glow); opacity: .7; }
.link.broken .wire { stroke: var(--degraded); stroke-dasharray: 2 5; opacity: .9; }
.link.related .wire, .link.selected .wire { stroke-width: 2; opacity: 1; }
.packet { fill: var(--glow); filter: url(#glow); }
.packet.flow { fill: var(--accent); }

.label { pointer-events: none; transition: opacity .25s; }
.label text { font: 600 11.5px "JetBrains Mono", ui-monospace, monospace; fill: var(--ink); paint-order: stroke; stroke: var(--bg); stroke-width: 3px; stroke-linejoin: round; }
.label .sub { font-weight: 400; font-size: 10px; fill: var(--ink-soft); }
.label line { stroke: var(--line-faint); }
.labels-off .label { display: none; }
.link-label { font: 10px "JetBrains Mono", ui-monospace, monospace; fill: var(--ink-soft); paint-order: stroke; stroke: var(--bg); stroke-width: 3px; pointer-events: none; }

@keyframes flicker { 50% { opacity: .55; } }
@keyframes breathe { 50% { opacity: .78; } }
.node.on .glow-layer { animation: breathe 3.2s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) {
  .node .glow-layer { animation: none !important; }
}

/* chrome */
header {
  position: fixed; top: 16px; left: 16px; right: 16px;
  display: flex; gap: 12px; align-items: flex-start; justify-content: space-between;
  pointer-events: none;
}
header > * { pointer-events: auto; }
.title h1 { margin: 0; font: 600 18px/1.2 "JetBrains Mono", ui-monospace, monospace; letter-spacing: -.01em; }
.title p { margin: 4px 0 0; color: var(--ink-soft); font-size: 12.5px; max-width: 52ch; }
.title a { color: var(--accent); }
.toolbar { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
button, select, input[type="search"] {
  font: inherit; font-size: 12.5px; color: var(--ink);
  background: var(--panel); border: 1px solid var(--panel-border); border-radius: 8px;
  padding: 6px 10px; box-shadow: var(--shadow); backdrop-filter: blur(8px);
}
button { cursor: pointer; }
button:hover { border-color: var(--accent); }
button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
button:focus-visible, select:focus-visible, input:focus-visible, .node:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input[type="search"] { width: 150px; }

.dock {
  position: fixed; left: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 8px;
  max-width: calc(100vw - 32px);
}
.row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.slider { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-soft);
  background: var(--panel); border: 1px solid var(--panel-border); border-radius: 8px; padding: 4px 10px; box-shadow: var(--shadow); }
.slider input { width: 110px; accent-color: var(--accent); }
.caption {
  background: var(--panel); border: 1px solid var(--panel-border); border-radius: 10px; box-shadow: var(--shadow);
  padding: 8px 12px; font-size: 12.5px; max-width: 520px; display: none;
}
.caption.show { display: block; }
.caption b { color: var(--accent); }

.legend {
  position: fixed; right: 16px; bottom: 16px; background: var(--panel); border: 1px solid var(--panel-border);
  border-radius: 10px; padding: 8px 12px; box-shadow: var(--shadow); font-size: 11.5px; color: var(--ink-soft);
  display: grid; grid-template-columns: auto auto; gap: 3px 12px;
}
.legend i { display: inline-block; width: 18px; height: 0; border-top: 2px solid; vertical-align: middle; margin-right: 6px; }

aside#panel {
  position: fixed; top: 84px; right: 16px; width: 340px; max-height: calc(100vh - 160px); overflow: auto;
  background: var(--panel); border: 1px solid var(--panel-border); border-radius: 12px; box-shadow: var(--shadow);
  padding: 14px 16px; display: none; backdrop-filter: blur(10px);
}
aside#panel.open { display: block; }
aside h2 { margin: 0 0 2px; font: 600 16px "JetBrains Mono", ui-monospace, monospace; }
aside h3 { margin: 14px 0 6px; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-soft); }
aside p { margin: 6px 0; }
aside ul { margin: 0; padding-left: 0; list-style: none; }
aside li { margin: 3px 0; font-size: 12.5px; }
aside a { color: var(--accent); word-break: break-all; }
.chip { display: inline-block; font: 11px "JetBrains Mono", ui-monospace, monospace; border: 1px solid var(--panel-border); border-radius: 999px; padding: 1px 8px; margin: 2px 4px 2px 0; }
.state-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
.close { position: absolute; top: 8px; right: 8px; box-shadow: none; padding: 2px 8px; }
.switch { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; padding: 8px 10px; border: 1px solid var(--panel-border); border-radius: 8px; }
.switch button { box-shadow: none; }
.linkish { background: none; border: none; box-shadow: none; padding: 0; color: var(--accent); cursor: pointer; font: inherit; font-size: 12.5px; text-decoration: underline; text-underline-offset: 2px; backdrop-filter: none; }
.impact { color: var(--degraded); font-size: 12.5px; }

details.textview { position: fixed; left: 16px; top: 100px; max-width: 360px; max-height: 50vh; overflow: auto;
  background: var(--panel); border: 1px solid var(--panel-border); border-radius: 10px; padding: 6px 12px; font-size: 12px; box-shadow: var(--shadow); display: none; }
details.textview.show { display: block; }

@media (max-width: 720px) {
  header { flex-direction: column; }
  .toolbar { justify-content: flex-start; }
  .legend { display: none; }
  aside#panel { top: auto; bottom: 0; right: 0; left: 0; width: auto; max-height: 55vh; border-radius: 14px 14px 0 0; }
  input[type="search"] { width: 120px; }
}
</style>
</head>
<body>
<div id="stage" aria-label="Interactive isometric map. Drag to orbit, scroll or pinch to zoom, shift-drag to pan.">
  <svg id="scene" role="img" aria-labelledby="scene-title">
    <title id="scene-title">Isometric stack map</title>
    <defs>
      <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur in="SourceGraphic" stdDeviation="3.2" result="b1"/>
        <feGaussianBlur in="SourceGraphic" stdDeviation="9" result="b2"/>
        <feMerge><feMergeNode in="b2"/><feMergeNode in="b1"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>
    <g id="world">
      <g id="g-platforms"></g>
      <g id="g-zones"></g>
      <g id="g-nodes"></g>
      <g id="g-links"></g>
      <g id="g-packets"></g>
      <g id="g-labels"></g>
    </g>
  </svg>
</div>

<header>
  <div class="title">
    <h1 id="t-title"></h1>
    <p id="t-sub"></p>
  </div>
  <div class="toolbar" role="toolbar" aria-label="View controls">
    <input type="search" id="search" placeholder="Find…  ( / )" aria-label="Find a component">
    <button id="b-iso" title="Snap to isometric (I)">Iso</button>
    <button id="b-rot-l" title="Rotate 90° left (←)" aria-label="Rotate left">⟲</button>
    <button id="b-rot-r" title="Rotate 90° right (→)" aria-label="Rotate right">⟳</button>
    <button id="b-top" title="Top-down view (T)">Top</button>
    <button id="b-fit" title="Fit to screen (F)">Fit</button>
    <button id="b-labels" aria-pressed="true" title="Toggle labels (L)">Labels</button>
    <button id="b-flow" aria-pressed="true" title="Toggle traffic animation (Space)">Traffic</button>
    <button id="b-text" aria-pressed="false" title="Text view of every component and connection">Text</button>
    <button id="b-theme" title="Toggle light / dark theme">◐</button>
  </div>
</header>

<details class="textview" id="textview" open><summary>Components &amp; connections</summary><div id="textview-body"></div></details>

<div class="dock">
  <div class="caption" id="caption" aria-live="polite"></div>
  <div class="row">
    <label class="slider">Explode <input type="range" id="explode" min="1.6" max="6" step="0.1" value="4.2" aria-label="Layer separation"></label>
    <select id="flows" aria-label="Play a flow"><option value="">▶ Play a flow…</option></select>
    <button id="b-reset" title="Power every component back on">Reset power</button>
  </div>
</div>

<div class="legend" aria-label="Legend">
  <span><i style="border-color: var(--glow)"></i>running</span>
  <span><i style="border-color: var(--degraded)"></i>degraded</span>
  <span><i style="border-color: var(--down)"></i>off</span>
  <span><i style="border-color: var(--line); border-top-style: dashed"></i>external / optional</span>
  <span><i style="border-color: var(--accent); border-top-style: dashed"></i>network zone</span>
  <span><i style="border-color: var(--line); border-top-style: dotted"></i>async link</span>
</div>

<aside id="panel" aria-live="polite"></aside>

<script>
(() => {
  'use strict';

  // ---------- data ----------
  let scene;
  try { scene = JSON.parse(document.getElementById('scene-data').textContent); }
  catch (e) { document.getElementById('t-title').textContent = 'Scene data could not be parsed'; return; }

  const SVGNS = 'http://www.w3.org/2000/svg';
  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const $ = (id) => document.getElementById(id);
  const el = (tag, attrs, parent) => {
    const n = document.createElementNS(SVGNS, tag);
    if (attrs) for (const k in attrs) n.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(n);
    return n;
  };
  const html = (tag, cls, text) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = String(text);
    return n;
  };
  // Only https links survive; anything else from the scene renders as plain text.
  const safeUrl = (u) => {
    try { const url = new URL(u); return url.protocol === 'https:' ? url.href : null; } catch { return null; }
  };

  const KIND = {
    service:  { shape: 'box', w: 1.6, d: 1.6, h: 1.1 },
    frontend: { shape: 'screen', w: 1.8, d: 1.3, h: 1.0 },
    client:   { shape: 'screen', w: 1.5, d: 1.1, h: 0.8 },
    gateway:  { shape: 'frustum', w: 1.8, d: 1.8, h: 0.7 },
    worker:   { shape: 'hex', r: 0.85, h: 1.0 },
    function: { shape: 'box', w: 1.0, d: 1.0, h: 0.8 },
    database: { shape: 'cylinder', r: 0.85, h: 1.3, rings: 2 },
    cache:    { shape: 'cylinder', r: 0.75, h: 0.6, rings: 0 },
    storage:  { shape: 'bucket', r: 0.85, h: 0.9 },
    queue:    { shape: 'queue', w: 2.4, d: 0.9, h: 0.6 },
    external: { shape: 'box', w: 1.5, d: 1.5, h: 0.9 },
    library:  { shape: 'box', w: 1.2, d: 1.2, h: 0.5 },
    infra:    { shape: 'box', w: 2.0, d: 1.4, h: 0.6 },
  };
  const SPACING = 3.4, BUS = 1.6, PLATFORM_H = 0.12, PAD = 1.4;

  const layers = (scene.layers || []).map((l, i) => ({ ...l, index: i }));
  const layerById = new Map(layers.map((l) => [l.id, l]));
  const nodes = (scene.nodes || []).filter((n) => layerById.has(n.layer)).map((n) => ({
    ...n, spec: { ...(KIND[n.kind] || KIND.service), ...(n.size || {}) },
    state0: ['on', 'idle', 'off', 'external'].includes(n.state) ? n.state : 'on',
  }));
  const nodeById = new Map(nodes.map((n) => [n.id, n]));
  const links = (scene.links || []).filter((l) => nodeById.has(l.from) && nodeById.has(l.to))
    .map((l, i) => ({ ...l, i, key: l.from + '->' + l.to }));
  const linkByKey = new Map(links.map((l) => [l.key, l]));
  const flows = (scene.flows || []).filter((f) => Array.isArray(f.steps) && f.steps.length);

  // ---------- layout ----------
  // Nodes with explicit x/y keep them (layer-local grid units). Others are ordered by the
  // barycenter of their neighbours on already-placed layers, then wrapped into rows.
  const neighbours = new Map(nodes.map((n) => [n.id, []]));
  links.forEach((l) => { neighbours.get(l.from).push(l.to); neighbours.get(l.to).push(l.from); });
  const placed = new Map();
  const order = [...layers].sort((a, b) => b.index - a.index); // top layer first
  for (const layer of order) {
    const members = nodes.filter((n) => n.layer === layer.id);
    const auto = members.filter((n) => typeof n.x !== 'number' || typeof n.y !== 'number');
    auto.forEach((n, i) => {
      const xs = neighbours.get(n.id).map((id) => placed.get(id)).filter(Boolean).map((p) => p.x);
      n._bary = xs.length ? xs.reduce((a, b) => a + b, 0) / xs.length : i * SPACING;
    });
    auto.sort((a, b) => a._bary - b._bary);
    const cols = auto.length <= 6 ? auto.length : Math.ceil(auto.length / 2);
    auto.forEach((n, i) => {
      n.x = (i % Math.max(cols, 1)) * SPACING;
      n.y = Math.floor(i / Math.max(cols, 1)) * SPACING;
    });
    // centre the layer on the origin so the stack lines up
    if (members.length) {
      const minX = Math.min(...members.map((n) => n.x)), maxX = Math.max(...members.map((n) => n.x));
      const minY = Math.min(...members.map((n) => n.y)), maxY = Math.max(...members.map((n) => n.y));
      const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
      members.forEach((n) => { n.x -= cx; n.y -= cy; placed.set(n.id, n); });
    }
    const half = (n) => (n.spec.r || Math.max(n.spec.w, n.spec.d) / 2);
    layer.bounds = members.length ? {
      x0: Math.min(...members.map((n) => n.x - half(n))) - PAD,
      x1: Math.max(...members.map((n) => n.x + half(n))) + PAD,
      y0: Math.min(...members.map((n) => n.y - half(n))) - PAD,
      y1: Math.max(...members.map((n) => n.y + half(n))) + PAD,
    } : { x0: -2, x1: 2, y0: -2, y1: 2 };
  }

  // ---------- camera ----------
  const ISO_PITCH = Math.atan(1 / Math.SQRT2);
  const cam = { yaw: Math.PI / 4, pitch: ISO_PITCH, zoom: 1, panX: 0, panY: 0, gap: 4.2 };
  const UNIT = 34;
  const layerZ = (layer) => layer.index * cam.gap;
  let vx, vy, vz, cy_, sy_, cp, sp;
  const updateCam = () => {
    cy_ = Math.cos(cam.yaw); sy_ = Math.sin(cam.yaw); cp = Math.cos(cam.pitch); sp = Math.sin(cam.pitch);
    vx = sy_ * cp; vy = cy_ * cp; vz = sp; // unit vector from the scene toward the viewer
  };
  const project = (x, y, z) => {
    const xr = x * cy_ - y * sy_, yr = x * sy_ + y * cy_;
    return [xr * UNIT, (yr * sp - z * cp) * UNIT, yr * cp + z * sp];
  };
  const pts = (arr) => arr.map((p) => { const q = project(p[0], p[1], p[2]); return q[0].toFixed(1) + ',' + q[1].toFixed(1); }).join(' ');

  // ---------- meshes ----------
  const prism = (foot, z0, h, topFoot) => {
    const top = (topFoot || foot).map(([x, y]) => [x, y, z0 + h]);
    const bot = foot.map(([x, y]) => [x, y, z0]);
    const faces = [{ poly: top, top: true }];
    for (let i = 0; i < foot.length; i++) {
      const j = (i + 1) % foot.length;
      faces.push({ poly: [bot[i], bot[j], top[j], top[i]] });
    }
    return faces;
  };
  const rect = (cx, cy, w, d) => [[cx - w / 2, cy - d / 2], [cx + w / 2, cy - d / 2], [cx + w / 2, cy + d / 2], [cx - w / 2, cy + d / 2]];
  const ngon = (cx, cy, r, k, rot = 0) => Array.from({ length: k }, (_, i) => {
    const a = rot + (i / k) * Math.PI * 2; return [cx + r * Math.cos(a), cy + r * Math.sin(a)];
  });
  const normalOf = (poly, centroid) => {
    const [a, b, c] = poly;
    const u = [b[0] - a[0], b[1] - a[1], b[2] - a[2]], w = [c[0] - a[0], c[1] - a[1], c[2] - a[2]];
    let n = [u[1] * w[2] - u[2] * w[1], u[2] * w[0] - u[0] * w[2], u[0] * w[1] - u[1] * w[0]];
    const fc = poly.reduce((s, p) => [s[0] + p[0], s[1] + p[1], s[2] + p[2]], [0, 0, 0]).map((v) => v / poly.length);
    if (n[0] * (fc[0] - centroid[0]) + n[1] * (fc[1] - centroid[1]) + n[2] * (fc[2] - centroid[2]) < 0) n = n.map((v) => -v);
    const len = Math.hypot(...n) || 1;
    return n.map((v) => v / len);
  };
  const hull = (p) => {
    p = p.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);
    const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
    const lo = [], up = [];
    for (const q of p) { while (lo.length >= 2 && cross(lo[lo.length - 2], lo[lo.length - 1], q) <= 0) lo.pop(); lo.push(q); }
    for (const q of p.reverse()) { while (up.length >= 2 && cross(up[up.length - 2], up[up.length - 1], q) <= 0) up.pop(); up.push(q); }
    return lo.slice(0, -1).concat(up.slice(0, -1));
  };
  const circle3 = (cx, cy, z, r, k = 40) => ngon(cx, cy, r, k).map(([x, y]) => [x, y, z]);

  const drawFaces = (g, faces, centroid) => {
    for (const f of faces) {
      const n = normalOf(f.poly, centroid);
      const dot = n[0] * vx + n[1] * vy + n[2] * vz;
      if (dot <= 0.001) continue;
      const shade = f.top ? 'top' : (Math.abs(n[0] * Math.cos(cam.yaw + Math.PI / 4)) > Math.abs(n[1] * Math.sin(cam.yaw + Math.PI / 4)) ? 'side-a' : 'side-b');
      el('polygon', { class: 'face ' + shade, points: pts(f.poly) }, g);
    }
  };
  const drawCylinder = (g, cx, cy, z0, r, h, rings, open) => {
    const bot = circle3(cx, cy, z0, r), top = circle3(cx, cy, z0 + h, r);
    const body = hull([...bot, ...top].map((p) => project(...p).slice(0, 2)));
    el('polygon', { class: 'face side-a', points: body.map((p) => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ') }, g);
    // front arcs: points on the circle that face the viewer
    const front = (z, rr = r) => {
      const ring = ngon(cx, cy, rr, 48).map(([x, y]) => [x, y, z]);
      const vis = ring.filter(([x, y]) => (x - cx) * vx + (y - cy) * vy >= -1e-6);
      if (vis.length < 2) return;
      // order by angle so the polyline is continuous
      const base = Math.atan2(vy, vx);
      vis.sort((a, b) => wrap(Math.atan2(a[1] - cy, a[0] - cx) - base) - wrap(Math.atan2(b[1] - cy, b[0] - cx) - base));
      el('polyline', { class: 'detail', points: pts(vis) }, g);
    };
    for (let i = 1; i <= rings; i++) front(z0 + (h * i) / (rings + 1));
    el('polygon', { class: 'face top', points: pts(top) }, g);
    if (open) el('polygon', { class: 'detail', points: pts(circle3(cx, cy, z0 + h, r * 0.8)) }, g);
  };
  const wrap = (a) => { while (a <= -Math.PI) a += 2 * Math.PI; while (a > Math.PI) a -= 2 * Math.PI; return a; };

  const drawNodeShape = (g, n) => {
    const s = n.spec, z0 = layerZ(layerById.get(n.layer)) + PLATFORM_H, x = n.x, y = n.y;
    const C = (h) => [x, y, z0 + h / 2];
    switch (s.shape) {
      case 'cylinder': drawCylinder(g, x, y, z0, s.r, s.h, s.rings || 0, false); break;
      case 'bucket': drawCylinder(g, x, y, z0, s.r, s.h, 0, true); break;
      case 'hex': drawFaces(g, prism(ngon(x, y, s.r, 6, Math.PI / 6), z0, s.h), C(s.h)); break;
      case 'frustum': drawFaces(g, prism(rect(x, y, s.w, s.d), z0, s.h, rect(x, y, s.w * 0.6, s.d * 0.6)), C(s.h)); break;
      case 'queue': {
        drawFaces(g, prism(rect(x, y, s.w, s.d), z0, s.h), C(s.h));
        const slots = 5;
        for (let i = 1; i < slots; i++) {
          const sx = x - s.w / 2 + (s.w * i) / slots;
          el('polyline', { class: 'detail', points: pts([[sx, y - s.d / 2, z0 + s.h], [sx, y + s.d / 2, z0 + s.h]]) }, g);
        }
        break;
      }
      case 'screen': {
        drawFaces(g, prism(rect(x, y, s.w, s.d), z0, s.h * 0.18), C(s.h * 0.18));
        const sz = z0 + s.h * 0.18;
        drawFaces(g, prism(rect(x, y - s.d * 0.3, s.w * 0.86, 0.08), sz, s.h * 0.82), [x, y - s.d * 0.3, sz + s.h * 0.41]);
        break;
      }
      default: drawFaces(g, prism(rect(x, y, s.w, s.d), z0, s.h), C(s.h));
    }
  };
  const nodeTop = (n) => {
    const s = n.spec;
    return [n.x, n.y, layerZ(layerById.get(n.layer)) + PLATFORM_H + s.h];
  };

  // ---------- link routing ----------
  // Rise from the source, run Manhattan-style on a bus above the higher of the two layers,
  // then drop into the target. A per-link lane offset keeps parallel cables apart.
  const route = (l) => {
    const a = nodeById.get(l.from), b = nodeById.get(l.to);
    const za = nodeTop(a), zb = nodeTop(b);
    const busZ = Math.max(layerZ(layerById.get(a.layer)), layerZ(layerById.get(b.layer))) + BUS + ((l.i % 5) - 2) * 0.09;
    const off = ((l.i % 3) - 1) * 0.18;
    const p = [za, [a.x + off, a.y + off, busZ], [b.x + off, a.y + off, busZ], [b.x + off, b.y + off, busZ], zb];
    return p.filter((q, i) => i === 0 || Math.hypot(q[0] - p[i - 1][0], q[1] - p[i - 1][1], q[2] - p[i - 1][2]) > 1e-6);
  };
  const pathLen = (p) => { let s = 0; for (let i = 1; i < p.length; i++) s += Math.hypot(p[i][0] - p[i - 1][0], p[i][1] - p[i - 1][1], p[i][2] - p[i - 1][2]); return s; };
  const pointAt = (p, t) => {
    let target = t * pathLen(p);
    for (let i = 1; i < p.length; i++) {
      const seg = Math.hypot(p[i][0] - p[i - 1][0], p[i][1] - p[i - 1][1], p[i][2] - p[i - 1][2]);
      if (target <= seg || i === p.length - 1) {
        const f = seg ? Math.min(target / seg, 1) : 0;
        return [0, 1, 2].map((k) => p[i - 1][k] + (p[i][k] - p[i - 1][k]) * f);
      }
      target -= seg;
    }
    return p[p.length - 1];
  };

  // ---------- power state ----------
  const power = new Map(nodes.map((n) => [n.id, n.state0 !== 'off']));
  // "consume"/"subscribe" links point from producer to consumer, so the consumer depends on the source.
  const dependsOn = (l) => (l.kind === 'consume' || l.kind === 'subscribe') ? [l.to, l.from] : [l.from, l.to];
  const computeStatus = () => {
    const status = new Map();
    const visit = (id, seen) => {
      if (status.has(id)) return status.get(id);
      if (!power.get(id)) { status.set(id, 'off'); return 'off'; }
      if (seen.has(id)) return 'ok';
      seen.add(id);
      let s = 'ok';
      for (const l of links) {
        if (l.critical === false) continue;
        const [dep, on] = dependsOn(l);
        if (dep !== id) continue;
        const t = visit(on, seen);
        if (t !== 'ok') { s = 'degraded'; break; }
      }
      seen.delete(id);
      status.set(id, s);
      return s;
    };
    nodes.forEach((n) => visit(n.id, new Set()));
    return status;
  };
  let status = computeStatus();
  const nodeClass = (n) => {
    const s = status.get(n.id);
    if (s === 'off') return 'off';
    if (s === 'degraded') return 'degraded';
    if (n.state0 === 'external') return 'external';
    if (n.state0 === 'idle') return 'idle';
    return 'on';
  };
  const linkLive = (l) => status.get(l.from) !== 'off' && status.get(l.to) !== 'off';

  // ---------- render ----------
  const svg = $('scene'), world = $('world');
  const G = { platforms: $('g-platforms'), zones: $('g-zones'), nodes: $('g-nodes'), links: $('g-links'), packets: $('g-packets'), labels: $('g-labels') };
  let selected = null, hovered = null, flowRun = null;
  const linkPaths = new Map();

  const render = () => {
    updateCam();
    Object.values(G).forEach((g) => g.replaceChildren());
    // platforms, bottom layer first
    for (const layer of layers) {
      const b = layer.bounds, z = layerZ(layer);
      const g = el('g', { class: 'platform' }, G.platforms);
      drawFaces(g, prism(rect((b.x0 + b.x1) / 2, (b.y0 + b.y1) / 2, b.x1 - b.x0, b.y1 - b.y0), z, PLATFORM_H), [(b.x0 + b.x1) / 2, (b.y0 + b.y1) / 2, z]);
      for (let gx = Math.ceil(b.x0); gx <= b.x1; gx += 1) el('polyline', { class: 'grid', points: pts([[gx, b.y0, z + PLATFORM_H], [gx, b.y1, z + PLATFORM_H]]) }, g);
      for (let gy = Math.ceil(b.y0); gy <= b.y1; gy += 1) el('polyline', { class: 'grid', points: pts([[b.x0, gy, z + PLATFORM_H], [b.x1, gy, z + PLATFORM_H]]) }, g);
      // label on the corner nearest the viewer
      const corners = [[b.x0, b.y0], [b.x1, b.y0], [b.x1, b.y1], [b.x0, b.y1]].map(([x, y]) => project(x, y, z));
      const left = corners.reduce((m, c) => (c[0] < m[0] ? c : m), corners[0]);
      const t = el('text', { class: 'platform-label', x: left[0] - 10, y: left[1] + 4, 'text-anchor': 'end' }, g);
      t.textContent = layer.label || layer.id;
    }
    // zones: dashed wireframe volumes around their member nodes
    for (const zone of scene.zones || []) {
      const ms = (zone.nodes || []).map((id) => nodeById.get(id)).filter(Boolean);
      if (!ms.length) continue;
      const r = (n) => (n.spec.r || Math.max(n.spec.w, n.spec.d) / 2) + 0.55;
      const x0 = Math.min(...ms.map((n) => n.x - r(n))), x1 = Math.max(...ms.map((n) => n.x + r(n)));
      const y0 = Math.min(...ms.map((n) => n.y - r(n))), y1 = Math.max(...ms.map((n) => n.y + r(n)));
      const z0 = Math.min(...ms.map((n) => layerZ(layerById.get(n.layer)))) + PLATFORM_H + 0.02;
      const z1 = Math.max(...ms.map((n) => nodeTop(n)[2])) + 0.45;
      const box = [[x0, y0], [x1, y0], [x1, y1], [x0, y1]];
      const g = el('g', null, G.zones);
      el('polygon', { class: 'zone', points: pts(box.map(([x, y]) => [x, y, z0])) }, g);
      el('polygon', { class: 'zone', points: pts(box.map(([x, y]) => [x, y, z1])) }, g);
      box.forEach(([x, y]) => el('polyline', { class: 'zone', points: pts([[x, y, z0], [x, y, z1]]) }, g));
      const right = box.map(([x, y]) => project(x, y, z1)).sort((a, b) => b[0] - a[0])[0];
      const t = el('text', { class: 'zone-label', x: right[0] + 8, y: right[1] + 4, 'text-anchor': 'start' }, g);
      t.textContent = zone.label || zone.id;
    }
    // nodes: by layer, then back to front
    const sorted = [...nodes].sort((a, b) => {
      const la = layerById.get(a.layer).index, lb = layerById.get(b.layer).index;
      if (la !== lb) return la - lb;
      return project(a.x, a.y, 0)[2] - project(b.x, b.y, 0)[2];
    });
    const rel = relatedSet();
    for (const n of sorted) {
      const g = el('g', { class: 'node ' + nodeClass(n), tabindex: 0, role: 'button', 'data-id': n.id, 'aria-label': `${n.label || n.id}, ${n.kind || 'service'}, ${status.get(n.id)}` }, G.nodes);
      if (selected && selected.type === 'node' && selected.id === n.id) g.classList.add('selected');
      if (rel && rel.nodes.has(n.id)) g.classList.add('related');
      const glow = el('g', { class: 'glow-layer' }, g);
      drawNodeShape(glow, n);
      const tt = el('title', null, g); tt.textContent = (n.label || n.id) + (n.tech ? ' · ' + n.tech.join(', ') : '');
    }
    // links
    linkPaths.clear();
    for (const l of links) {
      const p = route(l);
      linkPaths.set(l.key, p);
      const live = linkLive(l);
      const cls = ['link', l.async ? 'async' : '', live ? (status.get(l.from) === 'ok' ? 'live' : '') : 'broken'];
      if (rel && rel.links.has(l.key)) cls.push('related');
      if (selected && selected.type === 'link' && selected.id === l.key) cls.push('selected');
      const g = el('g', { class: cls.join(' '), 'data-link': l.key }, G.links);
      const d = 'M' + p.map((q) => { const s = project(...q); return s[0].toFixed(1) + ',' + s[1].toFixed(1); }).join(' L');
      el('path', { class: 'wire', d }, g);
      el('path', { class: 'hit', d }, g);
      const tt = el('title', null, g); tt.textContent = `${labelOf(l.from)} → ${labelOf(l.to)} · ${linkText(l)}`;
      if (rel && rel.links.has(l.key)) {
        const mid = project(...pointAt(p, 0.5));
        const t = el('text', { class: 'link-label', x: mid[0], y: mid[1] - 5, 'text-anchor': 'middle' }, G.labels);
        t.textContent = linkText(l);
      }
    }
    // labels above each node
    for (const n of sorted) {
      const top = nodeTop(n), a = project(top[0], top[1], top[2]), b = project(top[0], top[1], top[2] + 0.9);
      const g = el('g', { class: 'label' + (rel && rel.nodes.has(n.id) ? ' related' : '') }, G.labels);
      el('line', { x1: a[0], y1: a[1], x2: b[0], y2: b[1] + 4 }, g);
      const t = el('text', { x: b[0], y: b[1], 'text-anchor': 'middle' }, g); t.textContent = n.label || n.id;
      if (n.tech && n.tech.length) { const s = el('text', { class: 'sub', x: b[0], y: b[1] + 12, 'text-anchor': 'middle' }, g); s.textContent = n.tech[0]; }
    }
    svg.classList.toggle('dim', !!rel);
    applyView();
  };
  const labelOf = (id) => { const n = nodeById.get(id); return n ? (n.label || n.id) : id; };
  const linkText = (l) => [l.protocol, l.port ? ':' + l.port : '', l.async ? '(async)' : ''].filter(Boolean).join(' ').replace(' :', ':') || 'link';

  const relatedSet = () => {
    const focus = hovered || selected;
    if (!focus) return null;
    const ns = new Set(), ls = new Set();
    if (focus.type === 'node') {
      ns.add(focus.id);
      links.forEach((l) => { if (l.from === focus.id || l.to === focus.id) { ls.add(l.key); ns.add(l.from); ns.add(l.to); } });
    } else {
      const l = linkByKey.get(focus.id); if (l) { ls.add(l.key); ns.add(l.from); ns.add(l.to); }
    }
    return { nodes: ns, links: ls };
  };

  const applyView = () => {
    const r = svg.getBoundingClientRect();
    world.setAttribute('transform', `translate(${(r.width / 2 + cam.panX).toFixed(1)},${(r.height / 2 + cam.panY).toFixed(1)}) scale(${cam.zoom.toFixed(4)})`);
  };
  const fit = () => {
    updateCam();
    let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
    for (const layer of layers) {
      const b = layer.bounds, z = layerZ(layer);
      for (const [x, y] of [[b.x0, b.y0], [b.x1, b.y0], [b.x1, b.y1], [b.x0, b.y1]]) for (const zz of [z, z + BUS + 1.2]) {
        const p = project(x, y, zz); x0 = Math.min(x0, p[0]); x1 = Math.max(x1, p[0]); y0 = Math.min(y0, p[1]); y1 = Math.max(y1, p[1]);
      }
    }
    const r = svg.getBoundingClientRect();
    const topPad = r.width < 720 ? 150 : 100, botPad = 90;
    const availW = r.width - (r.width < 720 ? 120 : 320), availH = r.height - topPad - botPad;
    cam.zoom = Math.max(0.15, Math.min(2.2, Math.min(availW / (x1 - x0), availH / (y1 - y0))));
    cam.panX = -((x0 + x1) / 2) * cam.zoom;
    cam.panY = -((y0 + y1) / 2) * cam.zoom + (topPad - botPad) / 2;
    applyView();
  };

  // ---------- packets ----------
  let animOn = !reducedMotion;
  $('b-flow').setAttribute('aria-pressed', String(animOn));
  let last = performance.now(), clock = 0;
  const packetEls = [];
  const tick = (now) => {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (animOn || flowRun) clock += dt;
    G.packets.replaceChildren();
    if (animOn) {
      for (const l of links) {
        if (!linkLive(l) || status.get(l.from) !== 'ok') continue;
        const p = linkPaths.get(l.key); if (!p) continue;
        const len = pathLen(p), speed = 2.2 * (l.rate || 1), count = l.async ? 1 : Math.max(1, Math.round(len / 6));
        for (let k = 0; k < count; k++) {
          const t = ((clock * speed / len) + k / count + (l.i * 0.137)) % 1;
          const q = project(...pointAt(p, t));
          el('circle', { class: 'packet', cx: q[0].toFixed(1), cy: q[1].toFixed(1), r: l.async ? 2.6 : 2 }, G.packets);
        }
      }
      // links whose target is down: packets stall halfway and fade
      for (const l of links) {
        if (linkLive(l) || status.get(l.from) === 'off') continue;
        const p = linkPaths.get(l.key); if (!p) continue;
        const t = (clock * 0.5 + l.i * 0.21) % 1;
        const q = project(...pointAt(p, t * 0.5));
        el('circle', { class: 'packet', cx: q[0].toFixed(1), cy: q[1].toFixed(1), r: 2, opacity: (1 - t).toFixed(2), style: 'fill: var(--degraded)' }, G.packets);
      }
    }
    if (flowRun) stepFlow(dt);
    requestAnimationFrame(tick);
  };

  // ---------- flows ----------
  const caption = $('caption');
  const flowSel = $('flows');
  flows.forEach((f) => { const o = html('option', null, f.label || f.id); o.value = f.id; flowSel.appendChild(o); });
  if (!flows.length) flowSel.style.display = 'none';
  const startFlow = (id) => {
    const f = flows.find((x) => x.id === id);
    flowRun = f ? { f, step: 0, t: 0 } : null;
    if (!f) { caption.classList.remove('show'); hovered = null; render(); return; }
    showStep();
  };
  const showStep = () => {
    const { f, step } = flowRun, s = f.steps[step];
    caption.replaceChildren();
    const b = html('b', null, `${f.label || f.id} · ${step + 1}/${f.steps.length}`);
    caption.append(b, ' ', html('span', 'mono', `${labelOf(s.from)} → ${labelOf(s.to)}`), html('div', null, s.note || ''));
    if (s.cite) caption.append(citeEl(s.cite));
    caption.classList.add('show');
    const key = s.from + '->' + s.to;
    hovered = linkByKey.has(key) ? { type: 'link', id: key } : { type: 'node', id: s.to };
    render();
  };
  const stepFlow = (dt) => {
    const s = flowRun.f.steps[flowRun.step];
    const key = s.from + '->' + s.to;
    const p = linkPaths.get(key) || linkPaths.get(s.to + '->' + s.from);
    const reverse = !linkPaths.get(key);
    flowRun.t += dt / (reducedMotion ? 2.4 : 1.6);
    if (p) {
      const t = Math.min(flowRun.t, 1);
      const q = project(...pointAt(p, reverse ? 1 - t : t));
      el('circle', { class: 'packet flow', cx: q[0].toFixed(1), cy: q[1].toFixed(1), r: 4.5 }, G.packets);
    }
    if (flowRun.t >= 1.35) {
      flowRun.t = 0; flowRun.step++;
      if (flowRun.step >= flowRun.f.steps.length) { flowRun = null; flowSel.value = ''; hovered = null; render(); setTimeout(() => caption.classList.remove('show'), 2500); return; }
      showStep();
    }
  };
  flowSel.addEventListener('change', () => startFlow(flowSel.value));

  // ---------- panel ----------
  const panel = $('panel');
  const citeEl = (c) => {
    const li = html('div', 'mono');
    const text = typeof c === 'string' ? c : (c.path ? c.path + (c.line ? ':' + c.line : '') : '');
    const url = typeof c === 'object' ? safeUrl(c.url) : null;
    if (url) { const a = html('a', null, text || url); a.href = url; a.target = '_blank'; a.rel = 'noopener noreferrer'; li.appendChild(a); }
    else li.textContent = text;
    return li;
  };
  const stateColor = { ok: 'var(--glow)', degraded: 'var(--degraded)', off: 'var(--down)' };
  const openNode = (id) => {
    const n = nodeById.get(id); if (!n) return;
    selected = { type: 'node', id };
    panel.replaceChildren();
    const close = html('button', 'close', '×'); close.setAttribute('aria-label', 'Close'); close.onclick = deselect;
    const st = status.get(id);
    const meta = html('div');
    const dot = html('span', 'state-dot'); dot.style.background = stateColor[st];
    meta.append(dot, html('span', 'mono', `${n.kind || 'service'} · ${st === 'ok' ? n.state0 : st}${n.port ? ' · :' + n.port : ''}`));
    panel.append(close, html('h2', null, n.label || n.id), meta);
    if (n.tech && n.tech.length) { const t = html('div'); n.tech.forEach((x) => t.appendChild(html('span', 'chip', x))); panel.appendChild(t); }
    if (n.desc) panel.appendChild(html('p', null, n.desc));

    const sw = html('div', 'switch');
    sw.appendChild(html('span', null, power.get(id) ? 'Powered on' : 'Powered off'));
    const tb = html('button', null, power.get(id) ? 'Switch off' : 'Switch on');
    tb.onclick = () => { power.set(id, !power.get(id)); status = computeStatus(); openNode(id); render(); };
    sw.appendChild(tb);
    panel.appendChild(sw);
    const impact = blastRadius(id);
    if (impact.length) {
      const p = html('p', 'impact', `If this goes down: ${impact.length} component${impact.length > 1 ? 's' : ''} degrade — `);
      p.appendChild(document.createTextNode(impact.map(labelOf).join(', ')));
      panel.appendChild(p);
    }
    const section = (title, items) => {
      if (!items.length) return;
      panel.appendChild(html('h3', null, title));
      const ul = html('ul');
      items.forEach((l) => {
        const other = l.from === id ? l.to : l.from;
        const li = html('li');
        const b = html('button', 'linkish', labelOf(other)); b.onclick = () => { openNode(other); render(); };
        li.append(b, html('span', 'mono', '  ' + linkText(l) + (l.critical === false ? ' · optional' : '')));
        ul.appendChild(li);
      });
      panel.appendChild(ul);
    };
    section('Calls', links.filter((l) => l.from === id));
    section('Called by', links.filter((l) => l.to === id));
    if (n.cite && n.cite.length) { panel.appendChild(html('h3', null, 'Evidence')); n.cite.forEach((c) => panel.appendChild(citeEl(c))); }
    panel.classList.add('open');
  };
  const openLink = (key) => {
    const l = linkByKey.get(key); if (!l) return;
    selected = { type: 'link', id: key };
    panel.replaceChildren();
    const close = html('button', 'close', '×'); close.setAttribute('aria-label', 'Close'); close.onclick = deselect;
    panel.append(close, html('h2', null, `${labelOf(l.from)} → ${labelOf(l.to)}`), html('div', 'mono', linkText(l) + (l.critical === false ? ' · optional' : '')));
    if (l.desc) panel.appendChild(html('p', null, l.desc));
    const row = html('p');
    [l.from, l.to].forEach((id, i) => { const b = html('button', 'linkish', labelOf(id)); b.onclick = () => { openNode(id); render(); }; row.append(i ? '  →  ' : '', b); });
    panel.appendChild(row);
    if (l.cite && l.cite.length) { panel.appendChild(html('h3', null, 'Evidence')); l.cite.forEach((c) => panel.appendChild(citeEl(c))); }
    panel.classList.add('open');
  };
  const deselect = () => { selected = null; panel.classList.remove('open'); render(); };
  const blastRadius = (id) => {
    const was = power.get(id); power.set(id, false);
    const s = computeStatus(); power.set(id, was);
    return nodes.filter((n) => n.id !== id && s.get(n.id) === 'degraded' && status.get(n.id) === 'ok').map((n) => n.id);
  };

  // ---------- text view (accessible mirror) ----------
  const buildTextView = () => {
    const body = $('textview-body'); body.replaceChildren();
    for (const layer of [...layers].reverse()) {
      body.appendChild(html('h4', null, layer.label || layer.id));
      const ul = html('ul');
      nodes.filter((n) => n.layer === layer.id).forEach((n) => {
        const li = html('li');
        const b = html('button', 'linkish', n.label || n.id); b.onclick = () => { openNode(n.id); render(); };
        li.append(b, ` — ${n.kind || 'service'}${n.tech ? ' · ' + n.tech.join(', ') : ''}`);
        const out = links.filter((l) => l.from === n.id);
        if (out.length) li.append(html('div', 'mono', '→ ' + out.map((l) => `${labelOf(l.to)} (${linkText(l)})`).join(', ')));
        ul.appendChild(li);
      });
      body.appendChild(ul);
    }
  };

  // ---------- interaction ----------
  const stage = $('stage');
  const pointers = new Map();
  let drag = null, pinch = null;
  const hitTarget = (e) => {
    const node = e.target.closest && e.target.closest('.node');
    if (node) return { type: 'node', id: node.dataset.id };
    const link = e.target.closest && e.target.closest('.link');
    if (link) return { type: 'link', id: link.dataset.link };
    return null;
  };
  stage.addEventListener('pointerdown', (e) => {
    stage.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size === 2) {
      const [a, b] = [...pointers.values()];
      pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), zoom: cam.zoom, mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2, panX: cam.panX, panY: cam.panY };
      drag = null; return;
    }
    drag = { x: e.clientX, y: e.clientY, yaw: cam.yaw, pitch: cam.pitch, panX: cam.panX, panY: cam.panY, pan: e.shiftKey || e.button === 2, moved: false, target: hitTarget(e) };
  });
  stage.addEventListener('pointermove', (e) => {
    if (pointers.has(e.pointerId)) pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pinch && pointers.size === 2) {
      const [a, b] = [...pointers.values()];
      const d = Math.hypot(a.x - b.x, a.y - b.y);
      cam.zoom = Math.max(0.15, Math.min(4, pinch.zoom * d / pinch.d));
      cam.panX = pinch.panX + ((a.x + b.x) / 2 - pinch.mx);
      cam.panY = pinch.panY + ((a.y + b.y) / 2 - pinch.my);
      applyView(); return;
    }
    if (!drag) {
      const t = hitTarget(e);
      const changed = JSON.stringify(t) !== JSON.stringify(hovered);
      if (changed && !flowRun) { hovered = t; render(); }
      return;
    }
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (Math.hypot(dx, dy) > 4) drag.moved = true;
    if (!drag.moved) return;
    stage.classList.add('dragging');
    if (drag.pan) { cam.panX = drag.panX + dx; cam.panY = drag.panY + dy; applyView(); }
    else {
      cam.yaw = drag.yaw - dx * 0.008;
      cam.pitch = Math.max(0.17, Math.min(Math.PI / 2, drag.pitch + dy * 0.006));
      render();
    }
  });
  const endPointer = (e) => {
    pointers.delete(e.pointerId);
    if (pointers.size < 2) pinch = null;
    stage.classList.remove('dragging');
    if (drag && !drag.moved) {
      const t = drag.target;
      if (!t) deselect();
      else if (t.type === 'node') { openNode(t.id); render(); }
      else { openLink(t.id); render(); }
    }
    drag = null;
  };
  stage.addEventListener('pointerup', endPointer);
  stage.addEventListener('pointercancel', endPointer);
  stage.addEventListener('pointerleave', () => { if (!drag && hovered && !flowRun) { hovered = null; render(); } });
  stage.addEventListener('contextmenu', (e) => e.preventDefault());
  stage.addEventListener('wheel', (e) => {
    e.preventDefault();
    const r = svg.getBoundingClientRect();
    const mx = e.clientX - r.left - r.width / 2 - cam.panX, my = e.clientY - r.top - r.height / 2 - cam.panY;
    const k = Math.exp(-e.deltaY * 0.0015);
    const z = Math.max(0.15, Math.min(4, cam.zoom * k));
    cam.panX -= mx * (z / cam.zoom - 1); cam.panY -= my * (z / cam.zoom - 1);
    cam.zoom = z; applyView();
  }, { passive: false });
  G.nodes.addEventListener('keydown', (e) => {
    const g = e.target.closest('.node');
    if (g && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); openNode(g.dataset.id); render(); }
  });

  // animated camera moves
  let tween = null;
  const animateTo = (yaw, pitch) => {
    const from = { yaw: cam.yaw, pitch: cam.pitch }, t0 = performance.now(), dur = reducedMotion ? 1 : 520;
    const dy = wrap(yaw - from.yaw);
    cancelAnimationFrame(tween);
    const step = (now) => {
      const t = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - t, 3);
      cam.yaw = from.yaw + dy * e; cam.pitch = from.pitch + (pitch - from.pitch) * e;
      render();
      if (t < 1) tween = requestAnimationFrame(step);
    };
    tween = requestAnimationFrame(step);
  };
  const snapIso = () => animateTo(Math.round((cam.yaw - Math.PI / 4) / (Math.PI / 2)) * (Math.PI / 2) + Math.PI / 4, ISO_PITCH);
  $('b-iso').onclick = snapIso;
  $('b-rot-l').onclick = () => animateTo(cam.yaw + Math.PI / 2, cam.pitch);
  $('b-rot-r').onclick = () => animateTo(cam.yaw - Math.PI / 2, cam.pitch);
  $('b-top').onclick = () => animateTo(Math.round(cam.yaw / (Math.PI / 2)) * (Math.PI / 2), Math.PI / 2);
  $('b-fit').onclick = () => { fit(); render(); };
  $('b-labels').onclick = (e) => { const on = svg.classList.toggle('labels-off'); e.currentTarget.setAttribute('aria-pressed', String(!on)); };
  $('b-flow').onclick = (e) => { animOn = !animOn; e.currentTarget.setAttribute('aria-pressed', String(animOn)); };
  $('b-text').onclick = (e) => { const on = $('textview').classList.toggle('show'); e.currentTarget.setAttribute('aria-pressed', String(on)); };
  $('b-theme').onclick = () => {
    const root = document.documentElement;
    const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    root.dataset.theme = dark ? 'light' : 'dark';
    try { localStorage.setItem('stack-map-theme', root.dataset.theme); } catch {}
  };
  try { const t = localStorage.getItem('stack-map-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch {}
  $('b-reset').onclick = () => { nodes.forEach((n) => power.set(n.id, n.state0 !== 'off')); status = computeStatus(); if (selected && selected.type === 'node') openNode(selected.id); render(); };
  $('explode').addEventListener('input', (e) => { cam.gap = parseFloat(e.target.value); render(); });
  const search = $('search');
  search.addEventListener('input', () => {
    const q = search.value.trim().toLowerCase();
    if (!q) { hovered = null; render(); return; }
    const n = nodes.find((x) => (x.label || x.id).toLowerCase().includes(q) || (x.tech || []).some((t) => t.toLowerCase().includes(q)));
    hovered = n ? { type: 'node', id: n.id } : null; render();
  });
  search.addEventListener('keydown', (e) => { if (e.key === 'Enter' && hovered) { openNode(hovered.id); render(); } });
  window.addEventListener('keydown', (e) => {
    if (e.target.matches('input, select, textarea')) { if (e.key === 'Escape') e.target.blur(); return; }
    const k = e.key;
    if (k === '/') { e.preventDefault(); search.focus(); }
    else if (k === 'Escape') { if (flowRun) startFlow(''); deselect(); }
    else if (k === 'ArrowLeft') $('b-rot-l').click();
    else if (k === 'ArrowRight') $('b-rot-r').click();
    else if (k === 'i' || k === 'I') snapIso();
    else if (k === 't' || k === 'T') $('b-top').click();
    else if (k === 'f' || k === 'F') $('b-fit').click();
    else if (k === 'l' || k === 'L') $('b-labels').click();
    else if (k === ' ' && !e.target.closest('.node, button')) { e.preventDefault(); $('b-flow').click(); }
  });
  window.addEventListener('resize', () => { fit(); });

  // ---------- boot ----------
  $('t-title').textContent = scene.title || 'Stack map';
  document.title = (scene.title || 'Stack') + ' · Stack Map';
  const sub = $('t-sub');
  sub.textContent = scene.subtitle || '';
  const repo = safeUrl(scene.repoUrl);
  if (repo) {
    sub.append(' · ');
    const a = html('a', null, scene.commit ? '@' + String(scene.commit).slice(0, 7) : 'repo');
    a.href = repo; a.target = '_blank'; a.rel = 'noopener noreferrer'; sub.appendChild(a);
  }
  buildTextView();
  fit();
  render();
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
